name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
      - name: Validate sample manifests
        run: |
          python examples/make_sample.py
          python -m sg2.validate examples/manifest.clean.jsonl
          # dirty 必须以非零退出 —— 校验器抓不到缺陷才是 CI 失败
          if python -m sg2.validate examples/manifest.dirty.jsonl; then
            echo "::error::校验器未能抓到 dirty manifest 的拼接泄漏"
            exit 1
          fi
