[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamguard2"
version = "0.1.0"
description = "Training-free agentic streaming video guardrail: dataset spec, few-shot boundary adaptation, calibration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
validate = ["jsonschema>=4.20"]
adapt = ["scikit-learn>=1.3"]
media = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7.4", "jsonschema>=4.20", "scikit-learn>=1.3"]
all = ["jsonschema>=4.20", "scikit-learn>=1.3", "imageio-ffmpeg>=0.4.9"]

[project.urls]
Repository = "https://github.com/EchoRaven/StreamGuard-2.0"

[tool.setuptools.packages.find]
include = ["sg2*"]

[tool.setuptools.package-data]
sg2 = ["../spec/*.json", "../spec/taxonomy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: 需要 ffmpeg 渲染视频的端到端测试"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
